##### Core #####
set -g mouse on
set -g history-limit 200000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0

##### Prefix: Ctrl-a (optional but popular) #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Truecolor #####
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

##### Splits #####
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

##### Vim-like pane nav (vim-tmux-navigator) #####
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

##### Resize #####
bind -n C-Left  resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Down  resize-pane -D 5
bind -n C-Up    resize-pane -U 5

##### Reload #####
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

##### Dracula-ish status #####
set -g status on
set -g status-interval 3
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"

set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#50fa7b]#S #[fg=#6272a4]|"
set -g status-right "#[fg=#6272a4]%Y-%m-%d #[fg=#8be9fd]%H:%M"

setw -g window-status-format " #[fg=#6272a4]#I:#W "
setw -g window-status-current-format " #[fg=#f8f8f2,bold]#I:#W "

##### Agent launcher popup #####
# Ctrl-a a to pick an agent in a popup
bind a display-popup -E -w 90% -h 85% "bash -lc 'agent-ui'"

# Helper: Ctrl-a A opens a dedicated right-side agent pane (toggle-ish)
bind A if -F "#{==:#{pane_title},AGENT}" \
  "kill-pane" \
  "split-window -h -p 40 -c #{pane_current_path} 'bash -lc \"agent-ui\"' \; select-pane -L \; select-pane -T AGENT"

setw -g mode-keys vi
